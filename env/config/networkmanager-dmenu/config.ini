[dmenu]
dmenu_command = rofi -i -theme-str '#window { location: northeast; y-offset: 0; width: 25em; height: 100%%;} listview {lines: 16;}' -markup-rows
active_chars = ==
highlight = True
highlight_fg =
highlight_bg =
highlight_bold = True
compact = False
pinentry =
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon:<4}  <span font-family="FiraCode">{name:<{max_len_name}s}</span>  {sec:<{max_len_sec}s}
list_saved = False
prompt = 󰛳

[dmenu_passphrase]
obscure = False
obscure_color = #222222

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
